name: Java CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: make test
      - name: Package the tested JAR and demo data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.java == '17'
        working-directory: build
        run: |
          mkdir -p examples
          cp ../examples/{tracks,listens,chronological-plays}.tsv examples/
          sha256sum music-recommender.jar examples/*.tsv > music-recommender.jar.sha256
      - name: Upload the demo package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          name: music-recommender
          path: |
            build/music-recommender.jar
            build/music-recommender.jar.sha256
            build/examples/*.tsv
          if-no-files-found: error
          overwrite: true

  verify-download:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: music-recommender
      - name: Verify the downloaded JAR
        run: |
          sha256sum -c music-recommender.jar.sha256
          test "$(java -jar music-recommender.jar --version)" = "$GITHUB_SHA"
          java -jar music-recommender.jar recommend maya --limit 1 > ranking.tsv
          test "$(cut -f1,2 ranking.tsv | sed -n '2p')" = $'1\tt03'
